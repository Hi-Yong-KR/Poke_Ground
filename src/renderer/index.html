<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>PokeGround</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="targets"></div>
  <div id="stage"></div>
  <canvas id="fx"></canvas>

  <div id="bar" class="interactive">
    <div id="panel">
      <div id="panel-head">
        <span>포켓몬 그라운드</span>
        <button type="button" id="party-btn" title="화면에 내보낼 포켓몬 고르기 (여러 마리를 한 번에)">🎒 파티</button>
        <button type="button" id="dex-btn" title="도감에서 포켓몬 추가">＋ 포켓몬</button>
        <button type="button" id="dev-btn" title="입력/출력 장치 선택">⚙ 장치</button>
        <button type="button" id="menu-btn" title="메뉴 (몬스터볼 우클릭과 같음)">☰</button>
        <button type="button" id="quit-btn" title="프로그램 종료">✕ 종료</button>
      </div>
      <div id="party" hidden>
        <div class="party-head">
          <input id="party-q" placeholder="이름으로 찾기" autocomplete="off" spellcheck="false">
          <span id="party-count"></span>
          <button type="button" id="party-all" title="목록의 포켓몬을 모두 화면에 내보내기">전부 내보내기</button>
          <button type="button" id="party-none" title="화면의 포켓몬을 모두 몬스터볼로">전부 들여보내기</button>
        </div>
        <div id="party-grid"></div>
      </div>
      <div id="dex" hidden>
        <input id="dex-q" placeholder="이름 또는 도감 번호 (예: 파이리, 94)" autocomplete="off" spellcheck="false">
        <div id="dex-results"></div>
        <div class="dex-sub">내 그림으로 추가</div>
        <div class="make-row">
          <button type="button" id="make-file" title="PNG·GIF·WebP·JPG 한 장, 또는 PMD 스프라이트 zip (초상화 시트 portrait-XXXX.png와 함께 여러 개 골라도 돼요)">그림·zip 고르기</button>
          <button type="button" id="make-folder" title="AnimData.xml이 든 PMD 스프라이트 폴더">PMD 폴더</button>
          <span id="make-src">그림 한 장 또는 PMD 스프라이트</span>
        </div>
        <div class="make-row">
          <input id="make-name" placeholder="이름 (예: 시비꼬, 우리집 고양이)" autocomplete="off" spellcheck="false">
          <select id="make-type" title="타입 (쓸 기술이 정해져요)"></select>
          <button type="button" id="make-add" disabled>추가</button>
        </div>
        <div id="make-msg" class="dex-empty"></div>
        <div class="dex-sub">내가 추가한 포켓몬</div>
        <div id="dex-mine"></div>
      </div>
      <div id="devices" hidden>
        <label><span>🎤 입력</span><select id="mic-sel"></select></label>
        <div id="meter"><div id="meter-bar"></div></div>
        <label><span>🔊 출력</span><select id="spk-sel"></select><button type="button" id="spk-test">테스트</button></label>
        <label><span>🗣 인식</span><em id="stt-engine"></em></label>
      </div>
      <div id="log"></div>
      <div id="voice-line"><span id="mic-dot"></span><span id="voice-status">음성인식 준비 중...</span><span id="partial"></span><button type="button" id="mic-fix" hidden>설정 열기</button></div>
      <form id="cmd-form">
        <input id="cmd" autocomplete="off" spellcheck="false" placeholder="예) 피카츄 크롬 10만볼트 · 리자몽 휴지통 불대문자 · 모두 이리와">
        <button type="button" id="mic-btn" title="음성인식 켜기/끄기">🎤</button>
        <button type="submit" id="send-btn">명령</button>
      </form>
    </div>
    <button id="ball" title="명령창 (Ctrl+Alt+Space)"></button>
  </div>

  <script type="module" src="app.mjs"></script>
</body>
</html>
